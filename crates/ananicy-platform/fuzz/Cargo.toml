[package]
name = "ananicy-platform-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# The fuzz targets are built with sanitizer instrumentation by `cargo fuzz`, so
# they must not be part of the main workspace (whose `cargo test` runs without
# those flags).
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.ananicy-core]
path = "../../ananicy-core"

[dependencies.ananicy-platform]
path = ".."

[[bin]]
name = "parse_mounts"
path = "fuzz_targets/parse_mounts.rs"
test = false
doc = false

[[bin]]
name = "parse_cpuset"
path = "fuzz_targets/parse_cpuset.rs"
test = false
doc = false

[[bin]]
name = "parse_rule"
path = "fuzz_targets/parse_rule.rs"
test = false
doc = false
