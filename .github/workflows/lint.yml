name: Lint

on:
  pull_request:
    paths:
      - '**.rs'
      - '**Cargo.toml'
  push:
    paths:
      - '**.rs'
      - '**Cargo.toml'
      # Both jobs are `--locked`, so the committed lockfile decides what is
      # actually compiled. A lockfile-only bump can pull in a dependency whose
      # macros emit different diagnostics, and without this it would be merged
      # without ever being linted.
      - '**Cargo.lock'
  # As in `ci.yml`: the path filters leave changes that touch none of them
  # unchecked, and provide no way to re-run one that was cancelled by a newer
  # push.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          components: rustfmt
      - run: cargo +nightly fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `--all-features` builds the `bpf` crate, whose build script needs rustfmt
      # to generate the skeleton. See the note in `.github/workflows/ci.yml`.
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          components: clippy rustfmt
      - run: cargo clippy --locked --workspace --all-features --tests -- -D warnings
