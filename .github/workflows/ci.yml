name: CI

on:
  pull_request:
    paths:
      - '**.rs'
      - '**Cargo.toml'
      - '**Cargo.lock'
  push:
    paths:
      - '**.rs'
      - '**Cargo.toml'
      - '**Cargo.lock'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    # Scoped to this job on purpose: these containers install sccache via
    # `.github/actions/setup-rust`. Setting RUSTC_WRAPPER workflow-wide makes
    # the `matrix-distro` containers below fail with
    # "could not execute process `sccache rustc -vV`", because sccache is
    # neither installed nor on PATH there.
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    strategy:
      matrix:
        toolchain: [stable, nightly]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `rustfmt` is not a build tool here, it is a build requirement: the `bpf`
      # feature makes `ananicy-bpf`'s build script run libbpf-cargo, which
      # rustfmts the generated skeleton. rustup installs toolchains with a
      # minimal profile, so a freshly installed one has no rustfmt and the
      # skeleton generation panics. Stable only works by accident, via the
      # runner image's preinstalled toolchain.
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt
      - name: Build
        run: cargo build --locked --all-targets --all-features
      - name: Test
        run: sudo -E env "PATH=$PATH" cargo test --locked --all-targets --all-features

  matrix-distro:
    strategy:
      fail-fast: false
      matrix:
        distro:
          - fedora:latest
          - archlinux:latest
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.distro }}
    # No sccache env here on purpose, see the note on the `test` job above.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `pcre2-devel` is Fedora's name for what Debian calls `libpcre2-dev`, and
      # without it pcre2-sys vendors its own copy and the build stops matching
      # what `nix build` ships. `rustfmt` is a separate package on Fedora, for
      # the reason given on the `test` job; Arch has no such split, its `rust`
      # package carries the whole toolchain.
      - name: Install dependencies (Fedora)
        if: contains(matrix.distro, 'fedora')
        run: |
          dnf install -y gcc gcc-c++ git rust rustfmt cargo systemd-devel libbpf-devel pcre2-devel pkgconf-pkg-config clang make
      - name: Install dependencies (Arch Linux)
        if: contains(matrix.distro, 'archlinux')
        run: |
          pacman -Syu --noconfirm base-devel git rust cargo systemd libbpf pcre2 clang
      - name: Build
        run: cargo build --locked --all-targets --all-features
      - name: Test
        run: cargo test --locked --all-targets --all-features
