name: CI

on:
  pull_request:
    paths:
      - '**.rs'
      - '**Cargo.toml'
      - '**Cargo.lock'
  push:
    paths:
      - '**.rs'
      - '**Cargo.toml'
      - '**Cargo.lock'

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable, nightly]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.6
        
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsystemd-dev libbpf-dev
        
      - name: Build
        run: cargo build --all-targets --all-features
        
      - name: Test
        run: sudo -E env "PATH=$PATH" cargo test --all-targets --all-features

  matrix-distro:
    strategy:
      fail-fast: false
      matrix:
        distro:
          - fedora:latest
          - archlinux:latest
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies (Fedora)
        if: contains(matrix.distro, 'fedora')
        run: dnf install -y gcc gcc-c++ git rust cargo systemd-devel libbpf-devel make
        
      - name: Install dependencies (Arch Linux)
        if: contains(matrix.distro, 'archlinux')
        run: pacman -Syu --noconfirm base-devel git rust cargo systemd libbpf
        
      # sccache isn't natively available in these bare containers easily without setup, 
      # so we will use GitHub's native Rust cache action for distro matrices to speed them up.
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        
      - name: Build
        run: cargo build --all-targets --all-features
        
      - name: Test
        run: cargo test --all-targets --all-features
