name: CI

on:
  pull_request:
    paths:
      - '**.rs'
      - '**Cargo.toml'
      - '**Cargo.lock'
  push:
    paths:
      - '**.rs'
      - '**Cargo.toml'
      - '**Cargo.lock'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    # Scoped to this job on purpose: these containers install sccache via
    # `.github/actions/setup-rust`. Setting RUSTC_WRAPPER workflow-wide makes
    # the `matrix-distro` containers below fail with
    # "could not execute process `sccache rustc -vV`", because sccache is
    # neither installed nor on PATH there.
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    strategy:
      matrix:
        toolchain: [stable, nightly]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Build
        run: cargo build --locked --all-targets --all-features
      - name: Test
        run: sudo -E env "PATH=$PATH" cargo test --locked --all-targets --all-features

  matrix-distro:
    strategy:
      fail-fast: false
      matrix:
        distro:
          - fedora:latest
          - archlinux:latest
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.distro }}
    # No sccache env here on purpose, see the note on the `test` job above.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies (Fedora)
        if: contains(matrix.distro, 'fedora')
        run: |
          dnf install -y gcc gcc-c++ git rust cargo systemd-devel libbpf-devel libpcre2-devel pkgconf-pkg-config clang make
      - name: Install dependencies (Arch Linux)
        if: contains(matrix.distro, 'archlinux')
        run: |
          pacman -Syu --noconfirm base-devel git rust cargo systemd libbpf pcre2 clang
      - name: Build
        run: cargo build --locked --all-targets --all-features
      - name: Test
        run: cargo test --locked --all-targets --all-features
