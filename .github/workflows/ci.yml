name: CI

on:
  pull_request:
    paths:
      - '**.rs'
      - '**Cargo.toml'
      - '**Cargo.lock'
      # `**.nix` and `flake.lock` are for the `nix` job below, which reads the
      # flake. The module and the package expression live under contrib/nixos,
      # which `**.nix` already covers at any depth.
      - '**.nix'
      - 'flake.lock'
      # This file lists itself, unlike `lint.yml`: the jobs here run in
      # containers and against a toolchain this repository chooses, so a change
      # to what installs that toolchain is itself worth running.
      - '.github/workflows/ci.yml'
  push:
    paths:
      - '**.rs'
      - '**Cargo.toml'
      - '**Cargo.lock'
      - '**.nix'
      - 'flake.lock'
      - '.github/workflows/ci.yml'
  # The `paths` filters above mean that a change touching none of them — the
  # Makefile, `data/`, `contrib/**` — runs nothing at all. This file is the one
  # that lists itself, so a change to the jobs below is itself checked;
  # `lint.yml` does not. Dispatch runs the jobs whatever the filter says, and is
  # also how to re-run something a newer push cancelled.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# One group per ref, so a newer push to a branch cancels the run it supersedes
# instead of both running to completion. The prefix is what keeps this from
# cancelling `lint.yml` or `packaging.yml` outright: two runs share a group only
# when the group name matches, and an unprefixed `${{ github.ref }}` would put
# all three in one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Scoped to this job on purpose: these containers install sccache via
    # `.github/actions/setup-rust`. Setting RUSTC_WRAPPER workflow-wide makes
    # the `matrix-distro` containers below fail with
    # "could not execute process `sccache rustc -vV`", because sccache is
    # neither installed nor on PATH there.
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    strategy:
      # Without this the matrix cancels itself on the first failure, so a broken
      # `stable` silently hides the state of `nightly` and you cannot tell "nightly
      # is broken too" from "nightly never ran". Matches `matrix-distro` below.
      fail-fast: false
      matrix:
        toolchain: [stable, nightly]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `rustfmt` is not a build tool here, it is a build requirement: the `bpf`
      # feature makes `ananicy-bpf`'s build script run libbpf-cargo, which
      # rustfmts the generated skeleton. rustup installs toolchains with a
      # minimal profile, so a freshly installed one has no rustfmt and the
      # skeleton generation panics. Stable only works by accident, via the
      # runner image's preinstalled toolchain.
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt
      - name: Build
        run: cargo build --locked --all-targets --all-features
      - name: Test
        run: sudo -E env "PATH=$PATH" cargo test --locked --all-targets --all-features

  # Runs the benches and uploads the result; does not gate the build.
  #
  # Deliberately not a gate. Criterion on a shared runner is noisy at the
  # several-percent level — enough that a threshold produces a red build a
  # couple of times a month for a change that is not a regression, and a flaky
  # gate trains people to re-run it rather than read it. The value here is the
  # record: `docs/MEMORY.md` argues its numbers from measurement, and a
  # measurement nobody can reproduce after the fact is an assertion with extra
  # steps. The numbers land in this job's log and in the uploaded
  # `criterion` HTML, where a change's own before/after can be read off.
  bench:
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `components` and no `--all-features`, deliberately. The bench targets
      # use `ananicy-core` and `ananicy-platform` and nothing that the `bpf`
      # feature gates, so building them with it would make this job depend on
      # libbpf and clang being installed for no benefit. It also means this job
      # does not need `rustfmt`, which the `test` job needs only because the
      # `bpf` build script runs libbpf-cargo and formats the skeleton it
      # generates.
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
      - name: Build benches
        run: cargo bench --locked --no-run
      # The memory bench, which is the one `docs/MEMORY.md` quotes: live bytes
      # and live allocations per rule. Not criterion, and not a duration, so it
      # is not gated on a threshold either — it is printed and read.
      - name: Rule set footprint
        run: cargo bench --locked --bench alloc
      # Shortened from criterion's defaults (3 s warm-up, 5 s measurement per
      # case) so the job finishes; the numbers are for reading, not for
      # resolving a 5% difference.
      - name: Timings
        run: >-
          cargo bench --locked --bench rules --
          --warm-up-time 1 --measurement-time 2
      - name: Process name resolution
        run: >-
          cargo bench --locked --bench procfs --
          --warm-up-time 1 --measurement-time 2
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion
          path: target/criterion
          retention-days: 30

  matrix-distro:
    strategy:
      fail-fast: false
      matrix:
        distro:
          - fedora:latest
          # sid, not trixie, for the reason given in the job in
          # `.github/workflows/packaging.yml`: the workspace uses let chains,
          # which need rustc 1.88, and trixie ships 1.85.1.
          - debian:sid
          - archlinux:latest
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.distro }}
    # No sccache env here on purpose, see the note on the `test` job above.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `rustfmt` is a separate package on Fedora and on Debian, for the reason
      # given on the `test` job; Arch has no such split, its `rust` package
      # carries the whole toolchain.
      - name: Install dependencies (Fedora)
        if: contains(matrix.distro, 'fedora')
        run: |
          dnf install -y gcc gcc-c++ git rust rustfmt cargo systemd-devel libbpf-devel pkgconf-pkg-config clang make
      # `apt-get update` first: the image carries no package lists, and the
      # other two are not `apt` images, so this step cannot be shared. The
      # Debian counterparts of the packages above, one name per package:
      # `build-essential` is gcc, g++, make and the libc headers that linking
      # needs, and `ca-certificates` is not optional either -- the image has
      # none, and cargo fetches the registry over HTTPS. `pkg-config` and
      # `libsystemd-dev` are the `systemd` feature, `libbpf-dev` is
      # libbpf-sys, `clang` generates the BPF skeleton. `git` is here for
      # parity with the two images above and nothing in this job calls it:
      # actions/checkout already ran, in an image with no git, exactly as in
      # those two. See the note on `actions/checkout` in
      # `.github/workflows/packaging.yml` for what that costs.
      - name: Install dependencies (Debian)
        if: contains(matrix.distro, 'debian')
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates git \
            cargo rustc rustfmt \
            pkg-config libsystemd-dev libbpf-dev clang
      - name: Install dependencies (Arch Linux)
        if: contains(matrix.distro, 'archlinux')
        run: |
          pacman -Syu --noconfirm base-devel git rust cargo systemd libbpf clang
      - name: Build
        run: cargo build --locked --all-targets --all-features
      - name: Test
        run: cargo test --locked --all-targets --all-features

  nix:
    name: Nix devShell
    runs-on: ubuntu-latest
    # No sccache env here on purpose, see the note on the `test` job: the
    # devShell builds its own PATH, and nothing installs sccache into it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The same action, and for the same reason, as the Nix job in
      # `.github/workflows/packaging.yml`: it installs Nix onto the runner
      # rather than needing a distribution image, and leaves `nix flake` and
      # `nix develop` working for the steps below.
      - name: Install and Setup Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      # Deliberately no `setup-rust` and no rustup toolchain: the toolchain
      # under test is the one the flake pins, so a job that reached for the
      # runner's rustc would be testing something else. The devShell names
      # cargo, rustc, rustfmt, clippy, libbpf and clang itself, and
      # `inputsFrom` the package brings in pkg-config and the systemd headers,
      # so `--all-features` has everything its build scripts need.
      - name: Build
        run: nix develop --command cargo build --locked --all-targets --all-features
      # Unprivileged, unlike the `test` job above, and for the reason the
      # packaging jobs give: the cgroup tests in ananicy-platform are
      # unreliable as root, so they skip themselves with a message instead of
      # racing each other. `sudo -E` is not an option inside a devShell -- it
      # would replace the shell's PATH, and with it the cargo this is testing.
      # The root case is what the `test` job is for.
      - name: Test
        run: nix develop --command cargo test --locked --all-targets --all-features
