name: NixOS CI

# Also covers the Nix packaging recipe under contrib/nixos: `nix flake check`
# evaluates the package and the module, and `nix build` produces the derivation.
# There is deliberately no separate job for it in packaging.yml -- one job per
# artefact.
on:
  pull_request:
    paths:
      - "**.rs"
      - "**Cargo.toml"
      - "**Cargo.lock"
      - "**.nix"
      - "Makefile"
      - "data/**"
      - "contrib/**"
      - "flake.lock"
  push:
    paths:
      - "**.rs"
      - "**Cargo.toml"
      - "**Cargo.lock"
      - "**.nix"
      - "Makefile"
      - "data/**"
      - "contrib/**"
      - "flake.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install and Setup Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
        
      - name: Check Flake
        run: nix flake check
        
      - name: Build
        run: nix build
