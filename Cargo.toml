[package]
name = "ananicy-rs"
version = "0.1.0"
edition = "2024"
description = "ANother Auto NICe daemon rewrite in Rust for lower CPU and memory usage"
repository = "https://github.com/JohnRTitor/ananicy-rs"
license = "GPL-3.0-only"
keywords = ["cgroup", "daemon", "nice", "scheduler"]
categories = ["os::linux-apis", "system-tools"]

[workspace]
resolver = "2"
members = [
  "crates/ananicy-bpf",
  "crates/ananicy-core",
  "crates/ananicy-platform",
]
default-members = [
  ".",
  "crates/ananicy-bpf",
  "crates/ananicy-core",
  "crates/ananicy-platform",
]

[workspace.package]
license = "GPL-3.0-only"

[workspace.dependencies]
libc = "0.2.189"
rustix = "1.1.4"
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.20"
tracing = "0.1.44"

[[bench]]
harness = false
name = "rules"

[dependencies]
ananicy-bpf = { path = "crates/ananicy-bpf", version = "0.1.0", optional = true }
ananicy-core = { path = "crates/ananicy-core", version = "0.1.0" }
ananicy-platform = { path = "crates/ananicy-platform", version = "0.1.0" }
nanoargs = "0.6.0"
neli = "0.7.4"
rustix = { workspace = true, features = ["fs", "process", "shm"] }
sd-notify = "0.5.0"
signal-hook = "0.4.4"
tracing = { workspace = true }
tracing-journald = "0.3.2"
tracing-subscriber = "0.3.23"

[dev-dependencies]
assert_cmd = "2.2.2"
criterion = "0.5"
predicates = "3.1.4"
rstest = "0.26.1"

[features]
default = ["netlink"]
ananicy-bpf = ["dep:ananicy-bpf"]
bpf = ["ananicy-bpf"]
netlink = ["ananicy-platform/netlink"]
