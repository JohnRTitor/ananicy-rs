[package]
name = "ananicy-rs"
version.workspace = true
edition.workspace = true
description = "ANother Auto NICe daemon rewrite in Rust for lower CPU and memory usage"
repository.workspace = true
license.workspace = true
keywords = ["cgroup", "daemon", "nice", "scheduler"]
categories = ["os::linux-apis", "system-tools"]

[workspace]
resolver = "3"
members = [
  "crates/ananicy-bpf",
  "crates/ananicy-core",
  "crates/ananicy-platform",
]
# `ananicy-bpf` is deliberately not a default member. Its build script links
# against libbpf, so a plain `cargo build` or `cargo test` in the workspace would
# fail on a host that has the daemon's dependencies but not the eBPF ones — even
# though the default feature set does not use it. It is still a workspace member,
# so `--workspace` builds and tests it, and enabling the `bpf` feature pulls it
# in as a dependency.
default-members = [
  ".",
  "crates/ananicy-core",
  "crates/ananicy-platform",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/JohnRTitor/ananicy-rs"
license = "GPL-3.0-only"

[workspace.dependencies]
# The workspace members themselves. A member that uses another inherits it from
# here, so the path is written once.
ananicy-bpf = { path = "crates/ananicy-bpf" }
ananicy-core = { path = "crates/ananicy-core" }
ananicy-platform = { path = "crates/ananicy-platform" }

arc-swap = "1.9.2"
assert_cmd = "2.2.2"
bpaf = "0.9.28"
criterion = "0.8"
foldhash = "0.2.0"
libbpf-cargo = { version = "0.27.0", default-features = false }
libbpf-rs = { version = "0.27.0", default-features = false }
libc = "0.2.189"
lru = "0.18.3"
neli = "0.7.4"
pkg-config = "0.3.34"
predicates = "3.1.4"
proptest = "1.11.0"
regexr = "0.6.0"
rustix = "1.1.4"
sd-notify = "0.5.0"
serde = "1.0.229"
serde_json = "1.0.151"
signal-hook = "0.4.4"
tempfile = "3.27.0"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-journald = "0.3.2"
tracing-subscriber = "0.3.23"
walkdir = "2.5.0"

[[bench]]
harness = false
name = "rules"

# Not criterion, and deliberately so. This reports live bytes and live
# allocations for a loaded rule set — the two columns `docs/MEMORY.md` keeps a
# table of — and it has a `main` of its own rather than a criterion group. It
# measures a quantity, not a duration; `benches/rules.rs` owns timing.
[[bench]]
harness = false
name = "alloc"

# `get_command_from_pid` is on the per-process-event path, and the part of it
# this crate owns — building the `/proc/<pid>` path and the string handling
# around the two files it reads — is what this measures. The syscall cost
# belongs to the kernel.
[[bench]]
harness = false
name = "procfs"

[dependencies]
ananicy-bpf = { workspace = true, optional = true }
ananicy-core.workspace = true
ananicy-platform.workspace = true
bpaf = { workspace = true, features = ["derive", "autocomplete"] }
neli.workspace = true
rustix = { workspace = true, features = ["fs", "process", "shm"] }
sd-notify = { workspace = true, optional = true }
serde_json.workspace = true
signal-hook.workspace = true
tracing.workspace = true
tracing-journald = { workspace = true, optional = true }
tracing-subscriber.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
criterion.workspace = true
predicates.workspace = true
tempfile.workspace = true

[features]
default = ["netlink", "systemd"]
bpf = ["dep:ananicy-bpf"]
netlink = ["ananicy-platform/netlink"]
systemd = ["ananicy-platform/systemd", "dep:sd-notify", "dep:tracing-journald"]

[profile.release]
opt-level = 3
strip = true
lto = "fat"
panic = "abort"
codegen-units = 1

