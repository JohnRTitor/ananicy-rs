[package]
name = "ananicy-rs"
version.workspace = true
edition.workspace = true
description = "ANother Auto NICe daemon rewrite in Rust for lower CPU and memory usage"
repository.workspace = true
license.workspace = true
keywords = ["cgroup", "daemon", "nice", "scheduler"]
categories = ["os::linux-apis", "system-tools"]

[workspace]
resolver = "2"
members = [
  "crates/ananicy-bpf",
  "crates/ananicy-core",
  "crates/ananicy-platform",
]
default-members = [
  ".",
  "crates/ananicy-bpf",
  "crates/ananicy-core",
  "crates/ananicy-platform",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/JohnRTitor/ananicy-rs"
license = "GPL-3.0-only"

[workspace.dependencies]
ananicy-bpf = { path = "crates/ananicy-bpf" }
ananicy-core = { path = "crates/ananicy-core" }
ananicy-platform = { path = "crates/ananicy-platform" }
libc = "0.2.189"
lru = "0.18.3"
neli = "0.7.4"
rustix = "1.1.4"
serde = "1.0.229"
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.20"
tracing = "0.1.44"

[[bench]]
harness = false
name = "rules"

[dependencies]
ananicy-bpf = { workspace = true, optional = true }
ananicy-core = { workspace = true }
ananicy-platform = { workspace = true }
nanoargs = "0.6.0"
neli = { workspace = true }
rustix = { workspace = true, features = ["fs", "process", "shm"] }
sd-notify = { version = "0.5.0", optional = true }
signal-hook = "0.4.4"
tracing = { workspace = true }
tracing-journald = { version = "0.3.2", optional = true }
tracing-subscriber = "0.3.23"

[dev-dependencies]
assert_cmd = "2.2.2"
criterion = "0.5"
predicates = "3.1.4"
rstest = "0.26.1"

[features]
default = ["netlink", "systemd"]
ananicy-bpf = ["dep:ananicy-bpf"]
bpf = ["ananicy-bpf"]
netlink = ["ananicy-platform/netlink"]
systemd = ["dep:sd-notify", "dep:tracing-journald"]
